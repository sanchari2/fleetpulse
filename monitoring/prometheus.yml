global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: fleetpulse
    environment: local

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: fleetpulse
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8000
        labels:
          instance_name: fleetpulse-api

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
