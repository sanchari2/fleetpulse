# Default deny for the namespace, then allow exactly two things in: Prometheus
# scraping, and clients from the same namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fleetpulse
  labels:
    app.kubernetes.io/name: fleetpulse
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fleetpulse
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: http
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: http
