# Single-node cluster on your laptop (kind, k3d, minikube): one replica, and the
# image you just built locally.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: ghcr.io/sanchari2/fleetpulse
    newName: fleetpulse
    newTag: local

patches:
  - target:
      kind: Deployment
      name: fleetpulse
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
