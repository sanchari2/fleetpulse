name: ci

# commit -> test -> scan -> multi-arch image -> release -> deploy -> monitor
#
# The version is derived from Conventional Commits, the image is scanned before
# it is published, and the deploy job only runs on main with short-lived AWS
# credentials from OIDC. Nothing here stores a long-lived cloud key.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  pull-requests: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/fleetpulse

jobs:
  # ------------------------------------------------------------------ test
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            ci_doctor/requirements.txt

      - name: Install
        run: pip install -r requirements-dev.txt -r ci_doctor/requirements.txt

      - name: Lint
        run: flake8 src tests simulator ci_doctor

      - name: Unit tests with coverage gate
        run: pytest

      - name: Version script tests
        run: bash tests/test_next_version.sh

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Terraform validate
        working-directory: infra/terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate Kubernetes manifests
        run: kubeconform -strict -summary -ignore-missing-schemas k8s/base k8s/overlays

  # --------------------------------------------------------------- version
  version:
    name: next version
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.version }}
      bump: ${{ steps.semver.outputs.bump }}
      skip: ${{ steps.guard.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and full history are needed for git describe

      - name: Compute SemVer from Conventional Commits
        id: semver
        run: bash scripts/next_version.sh

      - name: Decide whether this commit may release
        id: guard
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ] || [ "${{ github.event_name }}" != "push" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "not a push to main: build and scan, do not release"
            exit 0
          fi
          if git rev-parse "v${{ steps.semver.outputs.version }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "v${{ steps.semver.outputs.version }} already exists; nothing to release"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        run: |
          {
            echo "### Version"
            echo ""
            echo "Bump: \`${{ steps.semver.outputs.bump }}\` -> \`v${{ steps.semver.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ scan
  scan:
    name: scan and smoke test
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build amd64 image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: fleetpulse:scan
          build-args: |
            APP_VERSION=v${{ needs.version.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          cache-from: type=gha,scope=scan

      - name: Trivy gate
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: fleetpulse:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Smoke test the image we just built
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 8000:8000 fleetpulse:scan
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/healthz
          curl -fsS -X POST http://127.0.0.1:8000/v1/telemetry \
            -H 'content-type: application/json' \
            -d '{"drone_id":"drone-01","battery_pct":42.5,"altitude_m":120,"speed_mps":12.5,"lat":12.97,"lon":77.59}'
          curl -fsS http://127.0.0.1:8000/v1/fleet/summary
          curl -fsS http://127.0.0.1:8000/metrics | grep fleetpulse_drone_battery_pct
          docker logs smoke | tail -5

      - name: Tear down the smoke container
        if: always()
        run: docker rm -f smoke || true

  # ----------------------------------------------------------------- image
  image:
    name: publish multi-arch image
    needs: [version, scan]
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=v${{ needs.version.outputs.version }}
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest

      - name: Build and push linux/amd64 + linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=v${{ needs.version.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          # SBOM and provenance are attached to the image, so you can prove
          # what went into the thing running on the instance.
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max

      - name: Summary
        run: |
          {
            echo "### Image"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "Platforms: linux/amd64, linux/arm64 (Graviton)"
          } >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------- release
  release:
    name: tag and release
    needs: [version, image]
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create the tag and the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: v${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "fleetpulse-ci"
          git config user.email "fleetpulse-ci@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            --notes "Image: \`${{ env.IMAGE }}:$VERSION\` (linux/amd64, linux/arm64)"

  # ---------------------------------------------------------------- deploy
  deploy:
    name: deploy to Graviton
    needs: [version, release]
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # the environment holds the protection rules; the credentials come from OIDC
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials from OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: fleetpulse-deploy-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Roll the container out through SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE_REF: ${{ env.IMAGE }}:v${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # No SSH, no open port, no key: the deploy is a logged SSM command.
          PARAMS=$(jq -nc --arg cmd "/usr/local/bin/fleetpulse-deploy $IMAGE_REF" '{commands: [$cmd]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "fleetpulse v${{ needs.version.outputs.version }}" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" \
            --output text)
          echo "command: $COMMAND_ID"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "{status:Status,stdout:StandardOutputContent,stderr:StandardErrorContent}" \
            --output json | tee /tmp/invocation.json
          STATUS=$(jq -r '.status' /tmp/invocation.json)
          echo "status: $STATUS"
          test "$STATUS" = "Success"
