name: ci-doctor

# Runs after a failed `ci` run on a pull request, reads the failed step logs and
# posts a diagnosis as a PR comment. It never fails the build: if the model or
# the API is unavailable it posts a note and exits 0, so the real failure stays
# the only thing that is red.
on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: ci-doctor-${{ github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # the workflow_run commit is untrusted input; check out the base branch
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ci_doctor/requirements.txt

      - name: Install
        run: pip install -r ci_doctor/requirements.txt

      - name: Diagnose the failed run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          CLAUDE_FALLBACK_MODELS: ${{ vars.CLAUDE_FALLBACK_MODELS }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::warning::ANTHROPIC_API_KEY is not set; the doctor will post a note only"
          fi
          python -m ci_doctor.cli \
            --repo "${{ github.repository }}" \
            --run-id "$RUN_ID" \
            --pr "$PR_NUMBER" \
            --run-url "$RUN_URL"
