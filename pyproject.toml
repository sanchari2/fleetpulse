[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fleetpulse"
version = "0.1.0"
description = "Telemetry service for a simulated drone fleet"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.163.1",
    "starlette==1.10.0",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.14.3",
    "prometheus-client==0.21.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "flake8==7.1.1",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "--cov=fleetpulse --cov-report=term-missing --cov-fail-under=85"
